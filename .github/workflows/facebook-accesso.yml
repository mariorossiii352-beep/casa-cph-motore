name: facebook-accesso

# Una tantum: apre un browser raggiungibile da un link protetto da password,
# l'utente entra in Facebook a mano, e il profilo si salva cifrato nella cache.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: facebook
  cancel-in-progress: false

jobs:
  accesso:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify fluxbox fonts-noto-color-emoji > /dev/null

      - name: Schermo, VNC e link
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 fluxbox > /dev/null 2>&1 &
          mkdir -p ~/.vnc
          x11vnc -storepasswd "$VNC_PASSWORD" ~/.vnc/passwd > /dev/null
          x11vnc -display :99 -forever -shared -rfbauth ~/.vnc/passwd -localhost -bg -quiet > /dev/null 2>&1
          websockify --web /usr/share/novnc 6080 localhost:5900 > /dev/null 2>&1 &
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 40); do
            U=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$U" ] && break
            sleep 2
          done
          echo "================================================================"
          echo "APRI QUESTO LINK:  $U/vnc.html?autoconnect=1&resize=scale"
          echo "================================================================"

      - name: Accesso a Facebook (25 minuti)
        working-directory: fb
        env:
          DISPLAY: ":99"
        run: python accesso.py 25

      - name: Cifra il profilo
        env:
          PROFILO_KEY: ${{ secrets.PROFILO_KEY }}
        run: |
          tar -C ~ --exclude='*Cache*' --exclude='Crashpad' --exclude='Service Worker' -czf - profilo-fb \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PROFILO_KEY -out profilo.enc
          ls -la profilo.enc

      - uses: actions/cache/save@v4
        with:
          path: profilo.enc
          key: fbprofilo-${{ github.run_id }}-${{ github.run_attempt }}
