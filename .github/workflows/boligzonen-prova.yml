name: boligzonen-prova

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cloudflare WARP (gratuito) in modalita' proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp > /dev/null
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          warp-cli --accept-tos status
          echo "IP senza WARP: $(curl -s https://api.ipify.org)"
          echo "IP con WARP:   $(curl -s --socks5-hostname 127.0.0.1:40000 https://api.ipify.org)"
          curl -s --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "warp|colo"

      - name: Prova semplice attraverso WARP
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          for U in "https://boligzonen.dk/lejebolig?property_search%5Bsort%5D=updated_at&sort=updated_at" "https://boligzonen.dk/lejebolig.json" "https://boligzonen.dk/lejeboliger/2-vaerelses-lejlighed-i-kobenhavn-v-583440"; do
            C=$(curl -s -L --compressed --socks5-hostname 127.0.0.1:40000 -A "$UA" -H "Accept-Language: da-DK,da;q=0.9" -o p.html -w "%{http_code}" "$U")
            echo "$C $(wc -c < p.html) byte - json-ld: $(grep -c 'application/ld+json' p.html) - controllo: $(grep -c -E 'Just a moment|Et øjeblik' p.html)"
          done

      - name: Browser attraverso WARP
        run: |
          pip install -q playwright==1.62.0
          python -m playwright install --with-deps chromium > /dev/null
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True, proxy={"server": "socks5://127.0.0.1:40000"})
              p = b.new_page(locale="da-DK")
              r = p.goto("https://boligzonen.dk/lejebolig?property_search%5Bsort%5D=updated_at&sort=updated_at", wait_until="domcontentloaded", timeout=60000)
              for _ in range(15):
                  if "CollectionPage" in p.content(): break
                  time.sleep(2)
              h = p.content()
              print("browser:", r.status if r else None, "titolo:", p.title()[:40], "| annunci:", "CollectionPage" in h)
              b.close()
          PY
