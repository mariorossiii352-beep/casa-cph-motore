name: facebook-prova

# Prova di tenuta: legge tutti i gruppi a giro e scrive solo numeri.
# La sessione arriva cifrata dalla release "sessione" e ci torna aggiornata.
on:
  workflow_dispatch:
    inputs:
      minuti:
        description: "Per quanti minuti leggere"
        default: "40"

permissions:
  contents: write

concurrency:
  group: facebook
  cancel-in-progress: false

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq xvfb fonts-noto-color-emoji > /dev/null

      - name: Scarica e decifra la sessione
        env:
          PROFILO_KEY: ${{ secrets.PROFILO_KEY }}
        run: |
          gh release download sessione -R "$GITHUB_REPOSITORY" -p sessione.enc \
            || { echo "ALLARME: nessuna sessione, serve accesso_pc.py"; exit 2; }
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PROFILO_KEY -in sessione.enc -out ~/sessione.json

      - name: Lettura
        working-directory: fb
        run: |
          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 python prova_lettura.py "${{ inputs.minuti }}"

      - name: Ricarica la sessione aggiornata
        if: success()
        env:
          PROFILO_KEY: ${{ secrets.PROFILO_KEY }}
        run: |
          rm -f sessione.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PROFILO_KEY -in ~/sessione.json -out sessione.enc
          rm -f ~/sessione.json
          gh release upload sessione sessione.enc --clobber -R "$GITHUB_REPOSITORY"
