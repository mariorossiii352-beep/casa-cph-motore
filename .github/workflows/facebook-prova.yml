name: facebook-prova

# Prova di tenuta: legge tutti i gruppi a giro e scrive solo numeri.
on:
  workflow_dispatch:
    inputs:
      minuti:
        description: "Per quanti minuti leggere"
        default: "40"

permissions:
  contents: read
  actions: write

concurrency:
  group: facebook
  cancel-in-progress: false

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-noto-color-emoji > /dev/null

      - uses: actions/cache/restore@v4
        with:
          path: profilo.enc
          key: fbprofilo-nessuno
          restore-keys: fbprofilo-

      - name: Decifra il profilo
        env:
          PROFILO_KEY: ${{ secrets.PROFILO_KEY }}
        run: |
          test -f profilo.enc || { echo "ALLARME: nessun profilo salvato, serve facebook-accesso"; exit 2; }
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PROFILO_KEY -in profilo.enc | tar -C ~ -xzf -

      - name: Lettura
        working-directory: fb
        run: |
          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 python prova_lettura.py "${{ inputs.minuti }}"

      - name: Cifra il profilo aggiornato
        env:
          PROFILO_KEY: ${{ secrets.PROFILO_KEY }}
        run: |
          rm -f profilo.enc
          tar -C ~ --exclude='*Cache*' --exclude='Crashpad' --exclude='Service Worker' -czf - profilo-fb \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PROFILO_KEY -out profilo.enc

      - uses: actions/cache/save@v4
        with:
          path: profilo.enc
          key: fbprofilo-${{ github.run_id }}-${{ github.run_attempt }}
